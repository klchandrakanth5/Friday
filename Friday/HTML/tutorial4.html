<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Tables of HTML</h2>
    <!--The HTML <table> tag is used to display data in a structured format using rows and columns.-->
    <table border="1">
        <tr> <!--It is used to define table row-->
            <th>This is First Table</th> <!--Used for table Header-->
        </tr>

        <tr>
            <td>One</td> <!--Used for data cells-->
        </tr>

        <tr>
            <td>Two</td>
        </tr>

        <tr>
            <td>Three</td>
        </tr>

        <tr>
            <td>Fourth</td>
        </tr>

        <tr>
            <td>Fifth</td>
        </tr>
        <tr>
            <td>Sixth</td>
        </tr>
    </table>
</body>
</html>
